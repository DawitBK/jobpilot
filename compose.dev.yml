# Local PostgreSQL 18 for development and integration tests.
#   pnpm db:up
#   export DATABASE_URL=postgres://jobpilot:jobpilot@localhost:5432/jobpilot_test
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: jobpilot
      POSTGRES_PASSWORD: jobpilot
      POSTGRES_DB: jobpilot
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jobpilot -d jobpilot']
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql
